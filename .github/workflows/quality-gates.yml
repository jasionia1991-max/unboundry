name: Quality gates

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 20 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lightweight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Safe test inventory
        run: npm run test:safe:preflight
      - name: TypeScript
        run: npx tsc --noEmit --pretty false -p tsconfig.check.json
      - name: Architecture boundaries
        run: npm run check:architecture
      - name: Source coverage inventory
        run: node scripts/check-source-coverage.mjs
      - name: Source coverage behavior
        run: node --test tests/source-coverage-behavior.test.mjs
      - name: Dependency vulnerabilities
        run: npm audit --audit-level=high
