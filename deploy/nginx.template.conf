# Offline release contract template. Render placeholders into a private staging
# file, then run the target host's nginx -t before any atomic switch.

map "{{UNBOUNDRY_TRAFFIC_MODE}}" $unboundry_maintenance_mode {
    default     1;
    maintenance 1;
    active      0;
}

log_format unboundry_release '$request_id $remote_addr "$request" '
                               '$status $request_length $bytes_sent '
                               '$request_time $upstream_response_time';

upstream unboundry_active {
    server 127.0.0.1:4173;
    keepalive 32;
}

server {
    listen 443 ssl;
    server_name {{UNBOUNDRY_SERVER_NAME}};

    ssl_certificate {{UNBOUNDRY_TLS_CERTIFICATE}};
    ssl_certificate_key {{UNBOUNDRY_TLS_CERTIFICATE_KEY}};
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/unboundry_release_access.log unboundry_release;
    client_max_body_size 600m;
    client_body_timeout 1h;
    keepalive_timeout 65s;

    error_page 418 =200 /maintenance.html;
    error_page 503 =503 @unboundry_api_maintenance;

    location = /maintenance.html {
        root /opt/unboundry/shared/maintenance;
        try_files /index.html =503;
        default_type text/html;
        add_header Cache-Control "no-store" always;
    }

    location @unboundry_api_maintenance {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "120" always;
        return 503 '{"error":"maintenance"}';
    }

    location = /api/updates {
        if ($unboundry_maintenance_mode = 1) { return 503; }

        proxy_pass http://unboundry_active;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_intercept_errors off;
        proxy_next_upstream off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        send_timeout 1h;
        add_header X-Accel-Buffering "no" always;
    }

    location ^~ /api/ {
        if ($unboundry_maintenance_mode = 1) { return 503; }

        proxy_pass http://unboundry_active;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_intercept_errors off;
        proxy_next_upstream off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        send_timeout 1h;
    }

    location / {
        if ($unboundry_maintenance_mode = 1) { return 418; }

        proxy_pass http://unboundry_active;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";
        proxy_intercept_errors off;
        proxy_next_upstream off;
        proxy_read_timeout 10m;
        proxy_send_timeout 10m;
        send_timeout 10m;
    }
}
