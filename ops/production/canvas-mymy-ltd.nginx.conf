# Production site contract for canvas.mymy.ltd.
# Keep the ACME HTTP route reachable; all application traffic is HTTPS-only.
server {
    listen 80;
    server_name canvas.mymy.ltd;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name canvas.mymy.ltd;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/canvas.mymy.ltd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/canvas.mymy.ltd/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 600m;
    proxy_request_buffering off;
    proxy_buffering off;

    location ~ ^/(?:\.|(?:client|server|types|scripts|spec|tests|deploy|ops)/|package(?:-lock)?\.json$|tsconfig(?:\.[^/]+)?\.json$) {
        return 404;
    }

    location = /robots.txt {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
